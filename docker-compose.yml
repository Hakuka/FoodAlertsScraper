services:
  food-alerts-scraper:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: food-alerts-scraper
    restart: unless-stopped
    env_file:
      - .env
    environment:
      TELEGRAM_BOT_TOKEN: ""
    secrets:
      - telegram_bot_token
    volumes:
      - ./data:/app/data

secrets:
  telegram_bot_token:
    file: ./secrets/telegram_bot_token.txt
